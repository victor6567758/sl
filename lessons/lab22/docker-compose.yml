# Lab 22b - free SIEM-style stack for the audit trail (no security plugin: LOCAL LAB USE ONLY).
services:
  opensearch:
    image: opensearchproject/opensearch:2
    environment: ["discovery.type=single-node", "DISABLE_SECURITY_PLUGIN=true", "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str0ng!Passw0rd", "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"]
    ports: ["127.0.0.1:9200:9200"]
  dashboards:
    image: opensearchproject/opensearch-dashboards:2
    environment: ["OPENSEARCH_HOSTS=[\"http://opensearch:9200\"]", "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"]
    ports: ["127.0.0.1:5601:5601"]
